// Copied verbatim from the installed Unity editor:
//   <Unity>/Editor/Data/PlaybackEngines/AndroidPlayer/Tools/GradleTemplates/mainTemplate.gradle
// with only the ML Kit dependency lines added to the dependencies block below.
// Copying from the editor in use keeps this file correct across Unity versions,
// because the placeholder tokens Unity substitutes differ between versions.
//
// TWO RULES FOR THIS HEADER, both learned the hard way in this spike:
//  1. ASCII only. Unity rewrites this file while substituting placeholders and turns
//     non-ASCII bytes into '?', which produces invalid Groovy.
//  2. Never write a Unity placeholder token literally, not even inside a comment.
//     Unity substitutes it here too, injecting a dependency list into the middle of
//     the comment and breaking the build.
// Both failures surface as a Gradle error about the launcher module, nowhere near the cause.
//
// Only the com.google.mlkit 'bundled' artifacts are used:
//   - models ship inside the AAR under assets/mlkit-google-ocr-models/
//   - the OCR engine is text-recognition-bundled-common's
//     jni/arm64-v8a/libmlkit_google_ocr_pipeline.so (about 11 MB)
//   - no Play Services model download
//
// google() and mavenCentral() already exist in Unity's settings template, and
// Unity 6 already emits android.useAndroidX / android.enableJetifier.

apply plugin: 'com.android.library'
apply from: '../shared/keepUnitySymbols.gradle'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // ML Kit Text Recognition v2 (bundled models, no Google Play Services)
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
**DEPS**}

android {
    namespace "com.unity3d.player"
    ndkPath "**NDKPATH**"
    ndkVersion "**NDKVERSION**"
    compileSdk **APIVERSION**
    buildToolsVersion "**BUILDTOOLS**"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
